services:

  webapp-frontend:
    container_name: ${NAMESPACE}_webapp_frontend
    # image: osioaliu/pump-and-dump-frontend
    # pull_policy: always
    build:
      context: ./webapp/frontend
      dockerfile: ../../.docker/node/Dockerfile
    working_dir: /app
    volumes:
      - ./webapp/frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - webapp-backend
    command: sh -c "npm install && npm run dev"

  webapp-backend:
    container_name: ${NAMESPACE}_webapp_backend
    image: osioaliu/pump-and-dump-backend
    pull_policy: always
    #build:
    #  context: ./webapp/backend
    #  dockerfile: ../../.docker/Backend/Dockerfile
    working_dir: /app
    volumes:
      - ./webapp/backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - init-db
    command: "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  python:
    #build:
    #  context: ./.docker/python
    #  args:
    #    PY_VERSION: ${PY_VERSION}
    container_name: ${NAMESPACE}_python
    image: osioaliu/python:${PY_VERSION}
    pull_policy: always
    tty: true
    init: true
    depends_on:
     - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    working_dir: /src
    command: >
      /bin/bash -c "
        pip install --upgrade pip &&
        pip install -r requirements.txt &&
        tail -f /dev/null
      "
    volumes:
      - ./src:/src
      - ./.env:/.env

  postgres:
    container_name: ${NAMESPACE}_postgres
    image: postgres:${POSTGRES_VERSION}
    pull_policy: always
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      retries: 5
      start_period: 10s

  init-db:
    image: postgres:${POSTGRES_VERSION}
    container_name: ${NAMESPACE}_init_db
    depends_on:
      - postgres
    env_file:
      - .env
    volumes:
      - ./src/sql:/docker-entrypoint-initdb.d
    entrypoint: ["/bin/bash", "-c", "sleep 5 && psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -f /docker-entrypoint-initdb.d/init_all.sql"]
    restart: "on-failure"
    networks:
      - default

volumes:
  pg_data:
  frontend_node_modules:
