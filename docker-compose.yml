services:

  webapp-frontend:
    container_name: ${NAMESPACE}_webapp_frontend
    image: node:${NODE_VERSION}
    working_dir: /app
    volumes:
      - ./webapp/frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - webapp-backend
    command: sh -c "npm install && npm run dev"

  webapp-backend:
    container_name: ${NAMESPACE}_webapp_backend
    image: osioaliu/python:${NAMESPACE}-${PY_VERSION}
    working_dir: /app
    volumes:
      - ./webapp/backend:/app
      - ./src:/app/src
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
    depends_on:
      - postgres
    command: >
      /bin/bash -c "
      uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "
  python:
    #build:
    #  context: ./.docker/python
    #  args:
    #    PY_VERSION: ${PY_VERSION}
    container_name: ${NAMESPACE}_python
    image: osioaliu/python:${NAMESPACE}-${PY_VERSION}
    tty: true
    init: true
    environment:
      - PYTHONPATH=/src
    depends_on:
     - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    working_dir: /src
    command: >
      /bin/bash -c "
      tail -f /dev/null
      "
    volumes:
      - ./cache:/cache
      - ./src:/src
      - ./.env:/.env
      - /dev/shm:/dev/shm

  postgres:
    container_name: ${NAMESPACE}_postgres
    image: postgres:${POSTGRES_VERSION}
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./.docker/db/import:/docker-entrypoint-initdb.d/
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      retries: 5
      start_period: 10s

volumes:
  pg_data:
  frontend_node_modules:
